[project]
name = "frotas"
version = "0.2.0"
description = "Gestão de Frotas multi-filial (Streamlit + Supabase)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: testes de ponta a ponta no navegador (requer playwright + chromium; execução opcional)"]
addopts = "-q -m 'not e2e'"
filterwarnings = [
    # avisos internos do supabase-py 2.31 (parâmetros que ele mesmo repassa ao postgrest)
    "ignore:The '(timeout|verify)' parameter is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
# a pasta ./supabase (migrations SQL) tem o mesmo nome do pacote supabase-py
known-third-party = ["supabase", "supabase_auth", "postgrest", "storage3"]
known-first-party = ["frotas"]
