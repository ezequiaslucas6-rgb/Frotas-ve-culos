# /etc/nginx/sites-available/frotas.conf
# Troque frotas.SEUDOMINIO.com.br pelo subdomínio escolhido. Depois:
#   sudo ln -s /etc/nginx/sites-available/frotas.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d frotas.SEUDOMINIO.com.br     # HTTPS (Let's Encrypt), renovação automática

server {
    listen 80;
    listen [::]:80;
    server_name frotas.SEUDOMINIO.com.br;

    # as fotos vão direto do celular para o Supabase Storage; aqui só passam formulários
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # arquivos estáticos com hash no nome: cache longo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
