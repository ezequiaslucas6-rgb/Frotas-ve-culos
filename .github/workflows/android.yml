name: App Android (APK)

# Compila o app Android (WebView do sistema) e publica o APK para download em
# Releases -> "App Android" (link fixo: .../releases/download/app-android/frotas.apk).
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Endereço do sistema que o app abre'
        default: 'https://frotas.209.50.240.59.sslip.io/'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: com a chave nos secrets, cada APK novo instala POR CIMA do anterior.
      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/frotas.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/frotas.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave dos secrets."
          else
            echo "::notice::Sem o secret ANDROID_KEYSTORE_BASE64: APK assinado com chave de depuração (para atualizar o app, desinstale a versão anterior). Veja o README."
          fi

      - name: Compilar APK
        env:
          APP_URL: ${{ inputs.app_url || 'https://frotas.209.50.240.59.sslip.io/' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PappUrl="$APP_URL" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/frotas.apk"
          ls -la "$RUNNER_TEMP/frotas.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: frotas-apk
          path: ${{ runner.temp }}/frotas.apk

      - name: Publicar para download (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ inputs.app_url || 'https://frotas.209.50.240.59.sslip.io/' }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android "$RUNNER_TEMP/frotas.apk" \
            --target "$GITHUB_SHA" \
            --title "App Android — versão 1.0.${{ github.run_number }}" \
            --notes "Instale no celular: baixe o frotas.apk, toque nele e permita instalar de fontes desconhecidas. O app abre o sistema em $APP_URL."
