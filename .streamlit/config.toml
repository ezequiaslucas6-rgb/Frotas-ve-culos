[theme]
primaryColor = "#3b5bdb"

[server]
enableXsrfProtection = true
maxUploadSize = 12          # MB (PDF do veículo até 10 MB; fotos são comprimidas no servidor)
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"   # não vaza stack traces para o usuário final
